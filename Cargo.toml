[package]
name    = "reverse-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow             = "1.0.101"
http-body-util     = "0.1.3"
hyper              = { version = "1.8.1", features = ["client", "http1", "server"] }
hyper-util         = { version = "0.1.20", features = ["tokio"] }
rand               = "0.10.0"
serde              = { version = "1.0.228", features = ["derive"] }
tokio              = {
    version  = "1.49.0",
    features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"]
}
toml               = "1.0.2"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[lints.clippy]
# All lint groups except restriction and cargo
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Explicit panics
expect_used   = "forbid"
panic         = "forbid"
todo          = "forbid"
unimplemented = "forbid"
unreachable   = "forbid"
unwrap_used   = "forbid"

# Implicit panics (and wrapping)
arithmetic_side_effects = "deny"   # Desired for atomic counters meant to wrap
indexing_slicing        = "forbid"
string_slice            = "forbid"

# Ignoring `#[must_use]`
let_underscore_must_use = "forbid"
unused_result_ok        = "forbid"

# Unsafe discipline (only relevant when `unsafe_code` is not set to "forbid")
multiple_unsafe_ops_per_block = "forbid"
undocumented_unsafe_blocks    = "forbid"

# Lint suppression
allow_attributes                = "forbid"
allow_attributes_without_reason = "forbid"

# Binding shadowing
shadow_reuse     = "forbid"
shadow_same      = "forbid"
shadow_unrelated = "forbid"

# Redundant constructs
redundant_test_prefix    = "deny"
unnecessary_self_imports = "warn"

[lints.rust]
unsafe_code = "forbid"

closure_returning_async_block = "warn"
redundant_imports             = "warn"
unused_qualifications         = "warn"
