[package]
name    = "reverse-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow             = "1.0.101"
http-body-util     = "0.1.3"
hyper              = { version = "1.8.1", features = ["client", "http1", "server"] }
hyper-util         = { version = "0.1.20", features = ["tokio"] }
rand               = "0.10.0"
serde              = { version = "1.0.228", features = ["derive"] }
tokio              = {
    version  = "1.49.0",
    features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"]
}
toml               = "1.0.2"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[lints.clippy]
all      = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

allow_attributes                = "forbid"
allow_attributes_without_reason = "forbid"
expect_used                     = "forbid"
unwrap_used                     = "forbid"

[lints.rust]
unsafe_code = "forbid"
